aid: upstream-bio
name: Upstream Bio
description: >-
  Upstream Bio is a clinical-stage biotechnology company headquartered at 460 Totten Pond Road in
  Waltham, Massachusetts, founded in 2021 and listed on Nasdaq as UPB since its October 2024 IPO. The
  company develops treatments for inflammatory disease with an initial focus on severe respiratory
  disorders, and its strategy is built around a single lead asset: verekitug (UPB-101), described by
  the company as the only known antagonist in clinical development that targets the receptor for
  thymic stromal lymphopoietin (TSLP). Verekitug has been advanced into Phase 2 studies in severe
  asthma, chronic rhinosinusitis with nasal polyps (CRSwNP) and chronic obstructive pulmonary disease
  (COPD), with a Phase 3 development strategy announced in 2026. Upstream Bio is a therapeutics
  developer rather than a software vendor: upstreambio.com is a fourteen-page WordPress marketing
  site, investor material is served from a hosted Q4-style investor-relations subdomain, and the
  company publishes no developer program, no public API, no SDK and no machine-readable API contract.
